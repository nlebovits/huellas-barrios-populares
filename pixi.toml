[workspace]
authors = ["nlebovits <nissim.lebovits@vanderbilt.edu>"]
channels = ["conda-forge"]
name = "huellas-barrios-populares"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
notebook = "jupyter lab"
execute = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 tutorial_python_es.ipynb tutorial_python_en.ipynb"
site = "quarto render"
preview = "quarto preview"

[activation.env]
PYTHONNOUSERSITE = "1"
JUPYTER_PREFER_ENV_PATH = "1"

[dependencies]
python = ">=3.12,<3.13"
duckdb = ">=1.5.2,<2"
pandas = ">=3.0.2,<4"
pyarrow = ">=23.0.1,<24"
geopandas = ">=1.1,<2"
folium = ">=0.20,<1"
mapclassify = ">=2.8,<3"
matplotlib = ">=3.10,<4"
jupyterlab = ">=4.4,<5"
nbconvert = ">=7.16,<8"
nbclient = ">=0.10,<1"
nbformat = ">=5.10,<6"
ipykernel = ">=6.29,<8"
pip = ">=26.2.2,<27"
quarto = ">=1.11,<2"

[pypi-dependencies]
geoparquet-io = ">=1.1.1, <1.2"
requests = ">=2.34.2, <3"
