# Reglas de Vale para detectar marcas de escritura generada por IA,
# copiadas de portolan-sdi/portolan-ops (.vale.ini y styles/, commit 7b2d67e).
#
#   ai-tells        tbhb/vale-ai-tells v1.37.0, se descarga con `vale sync`
#   Portolan-Voice  construcciones formulaicas
#   Portolan-Terms  solo Hype.yml (palabras de exageración)
#   Vale            solo para el vocabulario rechazado de Portolan
#
# portolan-ops desactiva siete reglas de ai-tells porque otras reglas suyas
# hacen el mismo control. Esas reglas no están en este repositorio, así que
# acá las siete siguen activas.
#
# Uso:
#   vale sync
#   vale --config .vale.ini <archivo.md>

StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Portolan
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Vale, Portolan-Terms, Portolan-Voice, ai-tells

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)
